name: Engineering checks
on:
  push:
    branches: [main]
    tags: ['phase/*', 'milestone/*']
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check project and SQL backup
        run: |
          python tools/engineering.py check
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          sql = Path('BOM/history_dump.sql').read_text(encoding='utf-8')
          with sqlite3.connect(':memory:') as db:
              db.executescript(sql)
              assert db.execute('pragma integrity_check').fetchone()[0] == 'ok'
              assert not db.execute('pragma foreign_key_check').fetchone()
          PY
      - name: Enforce phase tag gates
        if: startsWith(github.ref, 'refs/tags/phase/')
        run: python tools/engineering.py phase-gate "${GITHUB_REF_NAME#phase/}"
