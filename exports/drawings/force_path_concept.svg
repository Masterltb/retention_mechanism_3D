<text x="40" y="660">servo → pinion 12T → vòng đồng bộ 72T (6:1) → thanh nối → 6 cánh bản lề</text>
<text x="40" y="690">F_f ≈ μ W_d;  T_ring ≈ F_f r_eff;  T_servo ≈ T_ring/(i η_gear)</text>
