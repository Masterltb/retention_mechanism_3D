<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790">
<rect width="1200" height="790" fill="#fff"/>
<style>text{font:16px Arial,sans-serif;fill:#1d2d42}.small{font-size:13px}.title{font-size:23px;font-weight:bold}.head{font-size:18px;font-weight:bold}</style>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#be3838"/></marker></defs>
<text class="title" x="30" y="35">Một cột tô / hai tầng giữ — sơ đồ lực và ma sát v0.2</text>
<text class="small" x="30" y="60">Thông số tính là screening; cam, ray chống lật và khóa chưa phải chi tiết sản xuất.</text>
<text class="head" x="40" y="95">Mặt bằng một tầng ở trạng thái đóng</text>
<circle cx="185" cy="235" r="80.0" fill="none" stroke="#d18b20" stroke-width="2"/>
<circle cx="185" cy="235" r="87.85" fill="none" stroke="#2895aa" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="265.0" y="224.0" width="18.0" height="22.0" fill="#e3a64b" stroke="#8b5a15" transform="rotate(0.0 185 235)"/>
<rect x="265.0" y="224.0" width="18.0" height="22.0" fill="#e3a64b" stroke="#8b5a15" transform="rotate(60.0 185 235)"/>
<rect x="265.0" y="224.0" width="18.0" height="22.0" fill="#e3a64b" stroke="#8b5a15" transform="rotate(120.0 185 235)"/>
<rect x="265.0" y="224.0" width="18.0" height="22.0" fill="#e3a64b" stroke="#8b5a15" transform="rotate(180.0 185 235)"/>
<rect x="265.0" y="224.0" width="18.0" height="22.0" fill="#e3a64b" stroke="#8b5a15" transform="rotate(240.0 185 235)"/>
<rect x="265.0" y="224.0" width="18.0" height="22.0" fill="#e3a64b" stroke="#8b5a15" transform="rotate(300.0 185 235)"/>
<text x="315" y="140">6 guốc × rộng 22.0 mm</text>
<text x="315" y="170">Cung trống giữa 2 guốc: 61.9 mm</text>
<text x="315" y="200">Phủ chu vi ở mép trong: 26.1%</text>
<text x="315" y="230">Độ gối hình học tối đa: 7.85 mm</text>
<text x="315" y="260">Nét xanh đứt: Ø miệng tô; cam: vùng guốc.</text>
<text class="head" x="40" y="365">Mặt cắt một guốc chịu tải lệch tâm</text>
<rect x="90" y="430" width="320" height="40" fill="#415a85"/>
<text x="180" y="458" fill="white">khung / ray dưới</text>
<rect x="120" y="400" width="210" height="30" fill="#e3a64b" stroke="#8b5a15"/>
<text x="150" y="421">guốc dày 6 mm</text>
<rect x="120" y="378" width="210" height="12" fill="#8296ae"/>
<text x="375" y="392">ray trên cần thiết kế</text>
<path d="M240 325 L240 394" stroke="#be3838" stroke-width="3" marker-end="url(#arr)"/>
<text x="210" y="318">F_j ↓</text>
<path d="M240 344 L300 344" stroke="#202d42" stroke-width="2"/>
<text x="255" y="338">e = 10.0 mm (giả định)</text>
<text x="40" y="500">M_j = F_j · e;  R_t = M_j / h;  h = 8.0 mm (giả định)</text>
<text x="40" y="530">Ray/chốt chưa có trong CAD; không thể kết luận hệ số bền đến khi thử vật liệu và hình học.</text>
<text class="head" x="40" y="595">Đường truyền torque ứng viên</text>
<text x="40" y="630">MG996R 40.7 × 19.7 × 42.9 mm</text>
<text x="40" y="660">servo → giảm tốc 4:1 → cam 60° → guốc đi 20.0 mm</text>
<text x="40" y="690">F_ma sát = μ N;  T_cam ≈ F_ma sát (s/θ)/η_cam;  T_servo = T_cam/(i η_gear)</text>
<text class="small" x="40" y="740">Nguồn: requirements/parameters.json; design/friction_analysis.md; simulation/kinematics/force_friction_sensitivity.csv</text>
</svg>